[project]
name = "multiagentsystem"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek Singh", email = "singh752007abhishek@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "certifi>=2026.10.23",
    "email-validator>=2.4.0",
    "ipykernel>=7.4.0",
    "langchain>=1.5.1",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.3",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.22",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "readability>=0.3.2",
    "readability-lxml>=0.9",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "trafilatura>=2.3.1",
    "typing>=3.10.0.0",
]

[project.scripts]
multiagentsystem = "multiagentsystem:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
package = false
